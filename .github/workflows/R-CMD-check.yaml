name: R-CMD-check

on:
  # No branch filter on purpose. This repository's default branch is neither
  # `main` nor `master`, and a filter naming only those means the check never
  # runs and never reports — the worst failure mode for a CI job, because it
  # looks identical to passing.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: R-CMD-check (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ["release", "oldrel-1"]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The package contains no compiled code and its tests need no
          # simulator, so a plain check is the whole story here. The test that
          # needs a real DISPLACE is in the build workflow, where a binary
          # exists.
          args: 'c("--no-manual", "--as-cran")'
