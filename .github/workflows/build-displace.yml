name: Build DISPLACE binary

# Layer 2 of the architecture (see CLAUDE.md): builds the headless DISPLACE
# simulator from a pinned upstream ref and publishes a relocatable tarball as a
# release asset. The R package never compiles anything; it consumes what this
# workflow produces.
#
# Run this manually against a pinned SHA first and get it green before wiring
# anything automated to it.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream DISPLACE_GUI ref (tag, branch or commit SHA). Default: v1.8.0"
        required: true
        default: "96eadecb1980d6f9ad22571cd6f963cc05379815"
      release_tag:
        description: "Release tag to publish under. Leave empty to build without publishing."
        required: false
        default: ""
      targets:
        description: "Which glibc targets to build: 'both', '22.04', '24.04' or 'none'"
        required: false
        default: "both"
      build_macos:
        description: "Also build the macOS (Apple Silicon) binary"
        type: boolean
        required: false
        default: false
      build_windows:
        description: "Also build the Windows (x86_64) binary"
        type: boolean
        required: false
        default: false
      prerelease:
        description: "Mark the release as a pre-release (beta)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # Build on the oldest glibc you intend to support: a binary built on
        # 2.39 will not start on a 2.35 host, but the reverse works fine.
        run: |
          # 'none' builds no Linux target, so macOS can be added to an existing
          # release without rebuilding and re-uploading a Linux tarball that is
          # already published and verified.
          case "${{ inputs.targets }}" in
            22.04) m='[{"os":"ubuntu-22.04","glibc":"2.35"}]' ;;
            24.04) m='[{"os":"ubuntu-24.04","glibc":"2.39"}]' ;;
            none)  m='[]' ;;
            *)     m='[{"os":"ubuntu-22.04","glibc":"2.35"},{"os":"ubuntu-24.04","glibc":"2.39"}]' ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # An empty matrix is an error, not a no-op, so targets:none needs this.
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Check out displaceR
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libboost-all-dev rather than a subset: cmake/dependencies.cmake marks
          # unit_test_framework REQUIRED even with WITH_TESTS=Off.
          # libgdal-dev is a configure-time formality; GDAL is not linked.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git patchelf file binutils sqlite3 \
            libboost-all-dev libgeographiclib-dev libgdal-dev libsqlite3-dev

      - name: Record toolchain
        run: |
          cmake --version | head -1
          c++ --version | head -1
          ldd --version | head -1

      - name: Build
        run: |
          ./tools/build-displace.sh \
            --ref "${{ inputs.upstream_ref }}" \
            --workdir "$RUNNER_TEMP/displace-build" \
            --outdir "$GITHUB_WORKSPACE/dist" \
            --jobs "$(nproc)"

      - name: Verify the payload is relocatable
        # The build script already checks this in place. Repeat it after moving
        # the payload somewhere the build tree cannot help it, which is the
        # condition the user's server will actually be in.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relocated"
          cp -a dist/payload/. "$RUNNER_TEMP/relocated/"
          rm -rf "$RUNNER_TEMP/displace-build"
          cd "$RUNNER_TEMP/relocated"
          echo "--- ldd in a clean environment ---"
          env -u LD_LIBRARY_PATH ldd ./displace
          if env -u LD_LIBRARY_PATH ldd ./displace | grep -q 'not found'; then
            echo "::error::unresolved shared libraries after relocation"
            exit 1
          fi
          echo "--- RPATH ---"
          objdump -p ./displace | grep -E 'RPATH|RUNPATH'
          echo "--- --help ---"
          env -u LD_LIBRARY_PATH ./displace --help | head -20

      - name: Smoke test against DISPLACE_input_minitest
        # The strongest signal that the binary is usable. Best effort on the
        # clone: if the dataset cannot be fetched we skip rather than fail.
        #
        # Note the parameterisation name is "fake", not "minitest" — the folders
        # in that dataset are simusspe_fake/, vesselsspe_fake/ and so on.
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          if ! git clone --depth 1 https://github.com/frabas/DISPLACE_input_minitest.git minitest 2>/dev/null; then
            echo "minitest dataset unavailable; skipping the run smoke test"
            exit 1
          fi

          mkdir -p out
          cd "$RUNNER_TEMP/relocated"
          set +e
          env -u LD_LIBRARY_PATH ./displace \
            -f fake -F baseline \
            -a "$RUNNER_TEMP/minitest" \
            -O "$RUNNER_TEMP/out" \
            -s smoke -i 50 -V 0 \
            --disable-crash-handler > "$RUNNER_TEMP/smoke.log" 2>&1
          RC=$?
          set -e
          tail -20 "$RUNNER_TEMP/smoke.log"
          echo "exit status: $RC"

          # DISPLACE crashes during static destruction whenever SQLite output is
          # enabled, *after* the simulation has finished and everything is
          # written (docs/upstream-issues.md, issue 3). The signal varies run to
          # run -- 139 (SIGSEGV) and 134 (SIGABRT) both occur on identical
          # inputs -- so do NOT gate on a specific status. The database below is
          # the real evidence of whether the run completed; a status check here
          # would only add a coin flip.
          DB="$RUNNER_TEMP/out/DISPLACE_outputs/fake/baseline/fake_smoke_out.db"
          if [ ! -f "$DB" ]; then
            echo "::error::no output database at $DB"
            exit 1
          fi
          echo "--- database check ---"
          sqlite3 "$DB" "PRAGMA integrity_check;"
          LAST="$(sqlite3 "$DB" "SELECT Value FROM Metadata WHERE Key='lastTStep';")"
          echo "lastTStep=$LAST (requested 50 steps)"
          if [ -z "$LAST" ] || [ "$LAST" -lt 48 ]; then
            echo "::error::the run did not reach its step horizon"
            exit 1
          fi

          echo "--- outputs produced ---"
          find "$RUNNER_TEMP/out" -type f | wc -l
          if [ "$RC" -ne 0 ]; then
            echo "::warning::displace exited $RC in teardown; the run completed and outputs are intact (upstream issue 3)"
          fi

      - name: Golden-file regression against the new binary
        # Phase 4's actual drift detector: run the R readers against outputs
        # this binary just produced. Everything else in the suite pins down what
        # displaceR believes; this is what checks whether DISPLACE still agrees.
        # Skipped, not failed, when the minitest dataset could not be fetched.
        if: steps.smoke.outcome == 'success'
        id: golden
        continue-on-error: true
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run the golden-file tests
        if: steps.smoke.outcome == 'success' && steps.golden.outcome == 'success'
        continue-on-error: true
        env:
          DISPLACE_BINARY: ${{ runner.temp }}/relocated/displace
          DISPLACE_MINITEST_DIR: ${{ runner.temp }}/minitest
          DISPLACE_INPUT_NAME: fake
        run: |
          Rscript -e 'install.packages(c("testthat","jsonlite","DBI","RSQLite","pkgload"))'
          Rscript -e 'pkgload::load_all("."); testthat::test_local(".", reporter = "summary")'

      - name: Package
        id: package
        run: |
          set -euo pipefail
          SHA_SHORT="$(python3 -c "print('${{ inputs.upstream_ref }}'[:12])")"
          UPSTREAM_SHA="$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")"
          OSVER="${{ matrix.target.os }}"
          OSVER="${OSVER#ubuntu-}"
          NAME="displace-${UPSTREAM_SHA:0:12}-linux-x86_64-glibc${{ matrix.target.glibc }}"
          tar -czf "${NAME}.tar.gz" -C dist/payload .
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          {
            echo "name=${NAME}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "sha256=$(cut -d' ' -f1 "${NAME}.tar.gz.sha256")"
          } >> "$GITHUB_OUTPUT"
          cat "${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
            dist/build-info.json
            dist/displace-help.txt

      - name: Write manifest entry to the step summary
        # Paste this straight into inst/manifest.json. Kept manual on purpose:
        # a human should decide when a build becomes the pinned default.
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG:-<tag>}"
          {
            echo '### Manifest entry'
            echo
            echo '```json'
            cat <<JSON
          {
            "url": "${BASE}/${{ steps.package.outputs.name }}.tar.gz",
            "sha256": "${{ steps.package.outputs.sha256 }}",
            "upstream_sha": "${{ steps.package.outputs.upstream_sha }}",
            "glibc": "${{ matrix.target.glibc }}",
            "built_on": "${{ matrix.target.os }}",
            "arch": "x86_64"
          }
          JSON
            echo '```'
            echo
            echo '### Smoke test'
            echo "minitest run: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          UPSTREAM_SHA="${{ steps.package.outputs.upstream_sha }}"
          # Prepended to the notes only for a pre-release. Empty otherwise, which
          # leaves a blank first line the renderer ignores.
          BETA_BANNER=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            BETA_BANNER=$'> **Beta.** These binaries build and pass the minitest smoke test, but\n> have not been validated against a production case study. Pin an explicit\n> version in `install_displace()` rather than relying on the manifest\n> default if you need stability.\n'
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # GPL-2 section 3: the corresponding source must accompany the
            # binary. The upstream SHA plus tools/build-displace.sh at this
            # commit is exactly that, so it goes in the release notes.
            gh release create "$TAG" \
              ${{ inputs.prerelease && '--prerelease' || '' }} \
              --title "DISPLACE binaries${{ inputs.prerelease && ' (beta)' || '' }} ($TAG)" \
              --notes "$(cat <<NOTES
          ${BETA_BANNER}
          Headless DISPLACE simulator binaries built by \`.github/workflows/build-displace.yml\`.

          | | |
          |---|---|
          | Upstream repo | https://github.com/frabas/DISPLACE_GUI |
          | Upstream ref | \`${{ inputs.upstream_ref }}\` |
          | Upstream commit | \`${UPSTREAM_SHA}\` |
          | Build recipe | \`tools/build-displace.sh\` at ${{ github.sha }} |

          DISPLACE is GPL-2.0. The corresponding source for these binaries is the
          upstream commit above together with the build recipe at the commit above.
          See \`LICENSE.note\`.
          NOTES
          )"
          fi
          gh release upload "$TAG" \
            "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --clobber

  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  #
  # macos-14 and later are native Apple Silicon, so this produces an arm64
  # binary. Dependencies come from Homebrew rather than apt, and the payload is
  # .dylib rather than .so, but tools/build-displace.sh already handles both --
  # it was developed against a local Apple Silicon build. Everything specific to
  # the platform lives in that script, not here.
  #
  # Note the build applies a random_shuffle compatibility shim: libc++ removed
  # std::random_shuffle at C++17, which upstream still calls. The shim
  # reproduces libstdc++'s permutation exactly and keeps drawing from rand(), so
  # results follow the same seed as on Linux -- verified by
  # .github/workflows/verify-shim.yml. See docs/upstream-issues.md 14.
  build-macos:
    if: inputs.build_macos
    runs-on: macos-14
    steps:
      - name: Check out displaceR
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          # GDAL is deliberately absent: it is a configure-time formality that
          # the build script makes optional, and installing it here would cost
          # several minutes for something never linked.
          brew install boost geographiclib sqlite cmake

      - name: Record toolchain
        run: |
          cmake --version | head -1
          c++ --version | head -1
          sw_vers
          uname -m

      - name: Build
        run: |
          ./tools/build-displace.sh \
            --ref "${{ inputs.upstream_ref }}" \
            --workdir "$RUNNER_TEMP/displace-build" \
            --outdir "$GITHUB_WORKSPACE/dist" \
            --jobs "$(sysctl -n hw.ncpu)"

      - name: Verify the payload is relocatable
        # Same check as Linux, for the same reason: move the payload away from
        # the build tree and confirm it still starts. @loader_path is the dyld
        # equivalent of $ORIGIN, and getting it wrong produces a binary that
        # links cleanly and refuses to run.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/relocated"
          cp -a dist/payload/. "$RUNNER_TEMP/relocated/"
          rm -rf "$RUNNER_TEMP/displace-build"
          cd "$RUNNER_TEMP/relocated"
          echo "--- otool -L ---"
          otool -L ./displace
          echo "--- rpaths ---"
          otool -l ./displace | grep -A 2 LC_RPATH || true
          echo "--- arch ---"
          file ./displace
          echo "--- --help ---"
          env -u DYLD_LIBRARY_PATH ./displace --help | head -20

      - name: Smoke test against DISPLACE_input_minitest
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          git clone --depth 1 https://github.com/frabas/DISPLACE_input_minitest.git "$RUNNER_TEMP/minitest" || exit 1
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/relocated"
          set +e
          env -u DYLD_LIBRARY_PATH ./displace \
            -f fake -F baseline \
            -a "$RUNNER_TEMP/minitest" -O "$RUNNER_TEMP/out" \
            -s smoke -i 50 -V 0 --disable-crash-handler > "$RUNNER_TEMP/smoke.log" 2>&1
          RC=$?
          set -e
          tail -20 "$RUNNER_TEMP/smoke.log"
          echo "exit status: $RC"

          # As on Linux, the database is the evidence and the exit status is
          # not: DISPLACE crashes in teardown on every SQLite run.
          DB="$RUNNER_TEMP/out/DISPLACE_outputs/fake/baseline/fake_smoke_out.db"
          if [ ! -f "$DB" ]; then
            echo "::error::no output database at $DB"
            exit 1
          fi
          sqlite3 "$DB" "PRAGMA integrity_check;"
          LAST="$(sqlite3 "$DB" "SELECT Value FROM Metadata WHERE Key='lastTStep';")"
          echo "lastTStep=$LAST (requested 50 steps)"
          if [ -z "$LAST" ] || [ "$LAST" -lt 48 ]; then
            echo "::error::the run did not reach its step horizon"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::warning::displace exited $RC in teardown; the run completed and outputs are intact (upstream issue 3)"
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          UPSTREAM_SHA="$(python3 -c "import json;print(json.load(open('dist/build-info.json'))['upstream_sha'])")"
          ARCH="$(uname -m)"
          NAME="displace-${UPSTREAM_SHA:0:12}-macos-${ARCH}"
          tar -czf "${NAME}.tar.gz" -C dist/payload .
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          {
            echo "name=${NAME}"
            echo "arch=${ARCH}"
            echo "upstream_sha=${UPSTREAM_SHA}"
            echo "sha256=$(cut -d' ' -f1 "${NAME}.tar.gz.sha256")"
          } >> "$GITHUB_OUTPUT"
          cat "${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
            dist/build-info.json

      - name: Write manifest entry to the step summary
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG:-<tag>}"
          {
            echo '### macOS manifest entry'
            echo
            echo 'Add under the version'"'"'s "builds", keyed by os-arch:'
            echo
            echo '```json'
            cat <<JSON
          "macos-${{ steps.package.outputs.arch }}": {
            "url": "${BASE}/${{ steps.package.outputs.name }}.tar.gz",
            "sha256": "${{ steps.package.outputs.sha256 }}",
            "arch": "${{ steps.package.outputs.arch }}",
            "built_on": "macos-14"
          }
          JSON
            echo '```'
            echo
            echo "smoke test: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          # With targets 'none' this job runs without the Linux job, so the
          # release may not exist yet. Create it here rather than failing.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              ${{ inputs.prerelease && '--prerelease' || '' }} \
              --title "DISPLACE binaries${{ inputs.prerelease && ' (beta)' || '' }} ($TAG)" \
              --notes "Headless DISPLACE simulator binaries built by \`.github/workflows/build-displace.yml\` from upstream \`${{ inputs.upstream_ref }}\`. DISPLACE is GPL-2.0; see \`LICENSE.note\`."
          fi
          gh release upload "$TAG" \
            "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --clobber

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  #
  # A separate job, not tools/build-displace.sh: almost nothing is shared.
  # Dependencies come from vcpkg, the compiler is MSVC, there is no ELF/Mach-O
  # to patch, and Windows resolves DLLs from the directory holding the .exe, so
  # the payload needs no RPATH at all.
  #
  # Upstream builds its own Windows installer with MSVC at C++14, where
  # std::random_shuffle is still legal, so neither the cxx17 patch nor the
  # random_shuffle shim is applied here. The patches that ARE needed are
  # applied below with the same guards as in tools/build-displace.sh -- keep
  # the two in sync.
  #
  # Results follow the same seed as other Windows builds, not as Linux: MSVC's
  # rand() is a different generator from glibc's.
  build-windows:
    if: inputs.build_windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out displaceR
        uses: actions/checkout@v4

      - name: Check out sources
        run: |
          set -euo pipefail
          git clone https://github.com/frabas/DISPLACE_GUI.git upstream
          git -C upstream fetch --tags origin
          git -C upstream checkout --detach "${{ inputs.upstream_ref }}"
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          git clone --depth 1 https://github.com/greg7mdp/sparsepp.git sparsepp
          git clone --depth 1 https://github.com/studiofuga/mSqliteCpp.git mSqliteCpp
          # CMake wants D:/a/... paths, not the /d/a/... that Git Bash uses.
          echo "WS=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"

      - name: Apply build patches
        # Same guards as tools/build-displace.sh patches 1bb (gdal-optional)
        # and 1d (ices-optional).
        run: |
          set -euo pipefail
          PATCHES=""
          if grep -q 'find_package(GDAL REQUIRED 1.11)' upstream/cmake/dependencies.cmake; then
            sed -i 's/find_package(GDAL REQUIRED 1.11)/find_package(GDAL QUIET)/' upstream/cmake/dependencies.cmake
            PATCHES="${PATCHES}gdal-optional "
          fi
          LOADER=upstream/commons/TextfileModelLoader.cpp
          if grep -q 'graph_point_icesrectanglecode size' "$LOADER" &&
             grep -qF 'if (!fill_from_icesrectanglecode(icesrectanglecode_graph,' "$LOADER"; then
            sed -i 's/if (!fill_from_icesrectanglecode(icesrectanglecode_graph,/if (!icesrectanglecode_graph.is_open() || !fill_from_icesrectanglecode(icesrectanglecode_graph,/' "$LOADER"
            PATCHES="${PATCHES}ices-optional "
          fi
          echo "BUILD_PATCHES=${PATCHES% }" >> "$GITHUB_ENV"
          echo "applied: ${PATCHES:-none}"

      # vcpkg compiles Boost from source, ~25 minutes. Its binary cache
      # (one zip per built package) is restored here and saved straight after
      # the install, so a later step failing does not throw the work away.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build-displace.yml') }}
          restore-keys: vcpkg-x64-windows-

      - name: Install dependencies with vcpkg
        run: |
          set -euo pipefail
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet x64-windows \
            boost-date-time boost-filesystem boost-system boost-thread \
            boost-program-options boost-log boost-test boost-geometry \
            boost-interprocess sqlite3 geographiclib
          echo "CMAKE_TOOLCHAIN=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"

      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-${{ hashFiles('.github/workflows/build-displace.yml') }}

      - name: Build msqlitecpp
        run: |
          set -euo pipefail
          # Same missing find_package(SQLite3) as everywhere else; see
          # docs/upstream-issues.md 13.
          cat > sqlite-shim.cmake <<'SHIM'
          find_package(SQLite3 REQUIRED)
          if (NOT TARGET SQLite::SQLite3)
              add_library(SQLite::SQLite3 UNKNOWN IMPORTED)
              set_target_properties(SQLite::SQLite3 PROPERTIES
                  IMPORTED_LOCATION "${SQLite3_LIBRARY}"
                  INTERFACE_INCLUDE_DIRECTORIES "${SQLite3_INCLUDE_DIR}")
          endif()
          SHIM
          cmake -S mSqliteCpp -B mSqliteCpp/build -A x64 \
            -DENABLE_TEST=Off -DENABLE_PROFILER=Off \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
            -DCMAKE_PROJECT_INCLUDE="$WS/sqlite-shim.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$WS/local"
          cmake --build mSqliteCpp/build --config Release --target install

      - name: Build the headless simulator
        run: |
          set -euo pipefail
          # msqlitecpp's exported target carries no include directories
          # (docs/upstream-issues.md 2), hence the explicit -I. Dash-style,
          # not /I: Git Bash rewrites anything that looks like a Unix path, and
          # turned /EHsc into "C:/Program Files/Git/EHsc". Setting CMAKE_CXX_FLAGS
          # REPLACES CMake's MSVC defaults, so they are restated here: without
          # -EHsc exceptions are off, Boost defines BOOST_NO_EXCEPTIONS, and the
          # link fails on an unresolved boost::throw_exception.
          # _HAS_AUTO_PTR_ETC=1: vcpkg's Boost 1.92 requires C++17, which drops
          # std::random_shuffle. This restores MSVC's own implementation -- the
          # one upstream's Windows installer uses at C++14 -- so shuffles match
          # upstream's Windows binary. (macOS uses a libstdc++-faithful shim
          # instead; see docs/upstream-issues.md 14.)
          # VCPKG_MANIFEST_MODE=OFF: upstream ships a vcpkg.json listing its GUI
          # dependencies (CGAL, GDAL, ...). Honouring it rebuilds all of those,
          # and the first attempt died on a 404 fetching GMP's build tools.
          # The headless simulator needs only what the vcpkg step installed.
          # msqlitecpp installs its config straight into lib/cmake/ on Windows,
          # not lib/cmake/msqlitecpp/, and CMake only searches the latter. Point
          # at wherever it actually landed.
          MSQLITECPP_DIR="$(dirname "$(find local -name msqlitecppConfig.cmake | head -1)")"
          [ -n "$MSQLITECPP_DIR" ] || { echo "::error::msqlitecppConfig.cmake not installed"; exit 1; }
          cmake -S upstream -B upstream/build -A x64 \
            -Dmsqlitecpp_DIR="$WS/$MSQLITECPP_DIR" \
            -DWITHOUT_GUI=On \
            -DSPARSEPP_ROOT="$WS/sparsepp" \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_PREFIX_PATH="$WS/local" \
            -DCMAKE_CXX_FLAGS="-DWIN32 -D_WINDOWS -GR -EHsc -I$WS/local/include -D_HAS_AUTO_PTR_ETC=1" \
            -DCMAKE_EXE_LINKER_FLAGS="-DEBUG -OPT:REF -OPT:ICF" \
            -DCMAKE_SHARED_LINKER_FLAGS="-DEBUG -OPT:REF -OPT:ICF" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -Ob2 -DNDEBUG -Zi" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build upstream/build --config Release --target displace --parallel

      - name: Stage the payload
        id: stage
        run: |
          set -euo pipefail
          mkdir -p payload
          find upstream/build -name 'displace.exe' -path '*Release*' -exec cp {} payload/ \;
          [ -f payload/displace.exe ] || find upstream/build -name 'displace.exe' -exec cp {} payload/ \;
          find upstream/build -name '*.dll' -path '*Release*' -exec cp {} payload/ \;
          find local -name '*.dll' -exec cp {} payload/ \;
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll payload/
          # The MSVC runtime is not guaranteed on a bare Windows machine (R for
          # Windows is built with mingw and does not ship it). App-local
          # deployment of these DLLs is what Microsoft's redist terms allow.
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" payload/
          done
          cat > payload/build-info.json <<JSON
          {
            "upstream_ref": "${{ inputs.upstream_ref }}",
            "upstream_sha": "${UPSTREAM_SHA}",
            "displace_version": "$(sed -n 's/^#define VERSION "\(.*\)"$/\1/p' upstream/include/version.h | head -1)",
            "built_on": "windows-2022",
            "arch": "x86_64",
            "build_patches": "${BUILD_PATCHES}"
          }
          JSON
          ls -la payload/
          test -f payload/displace.exe || { echo "::error::no displace.exe produced"; exit 1; }
          echo "name=displace-${UPSTREAM_SHA:0:12}-windows-x86_64" >> "$GITHUB_OUTPUT"

      - name: Verify it runs from a clean directory
        run: |
          set -euo pipefail
          cp -r payload "$RUNNER_TEMP/relocated"
          cd "$RUNNER_TEMP/relocated"
          ./displace.exe --help | head -5

      - name: Smoke test against DISPLACE_input_minitest
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          git clone --depth 1 https://github.com/frabas/DISPLACE_input_minitest.git "$RUNNER_TEMP/minitest" || exit 1
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/relocated"
          set +e
          ./displace.exe -f fake -F baseline \
            -a "$(cygpath -m "$RUNNER_TEMP/minitest")" -O "$(cygpath -m "$RUNNER_TEMP/out")" \
            -s smoke -i 50 -V 0 --disable-crash-handler > "$RUNNER_TEMP/smoke.log" 2>&1
          RC=$?
          set -e
          tail -20 "$RUNNER_TEMP/smoke.log"
          echo "exit status: $RC"
          # As on Linux and macOS, the database is the evidence, not the status.
          DB="$RUNNER_TEMP/out/DISPLACE_outputs/fake/baseline/fake_smoke_out.db"
          test -f "$DB" || { echo "::error::no output database at $DB"; exit 1; }
          LAST="$(python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute(\"SELECT Value FROM Metadata WHERE Key='lastTStep'\").fetchone()[0])" "$(cygpath -m "$DB")")"
          echo "lastTStep=$LAST (requested 50 steps)"
          if [ -z "$LAST" ] || [ "$LAST" -lt 48 ]; then
            echo "::error::the run did not reach its step horizon"
            exit 1
          fi

      - name: Diagnose a failed smoke test
        # Only runs when the smoke test failed. The build carries PDBs (-Zi and
        # -DEBUG above, same optimisation level), so the debugger can name the
        # crashing frames. Also retries with SQLite output off, which separates
        # "the simulator is broken" from "the SQLite layer is broken".
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/relocated"
          find "$GITHUB_WORKSPACE/upstream/build" -name '*.pdb' -path '*Release*' -exec cp {} . \; 2>/dev/null || true
          echo "--- PDBs: $(ls *.pdb 2>/dev/null | tr '\n' ' ')"
          IN="$(cygpath -m "$RUNNER_TEMP/minitest")"
          CDB="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          if [ -x "$CDB" ]; then
            rm -rf "$RUNNER_TEMP/out-dbg"; mkdir -p "$RUNNER_TEMP/out-dbg"
            MSYS_NO_PATHCONV=1 "$CDB" -g -G -o -y "$(cygpath -w "$PWD")" \
              -c ".lines -e; .ecxr; kP 40; q" \
              ./displace.exe -f fake -F baseline -a "$IN" \
              -O "$(cygpath -m "$RUNNER_TEMP/out-dbg")" -s dbg -i 50 -V 0 \
              --disable-crash-handler > "$RUNNER_TEMP/cdb.log" 2>&1
            echo "--- debugger: exception and stack ---"
            grep -nE "Access violation|exception|code [0-9a-f]{8}|^[0-9a-f]{2} [0-9a-f]{8}|![A-Za-z_]" "$RUNNER_TEMP/cdb.log" | tail -60
          else
            echo "cdb not found at $CDB"
          fi
          echo "--- retry with --disable-sqlite ---"
          rm -rf "$RUNNER_TEMP/out-nosql"; mkdir -p "$RUNNER_TEMP/out-nosql"
          ./displace.exe -f fake -F baseline -a "$IN" \
            -O "$(cygpath -m "$RUNNER_TEMP/out-nosql")" -s nosql -i 50 -V 0 \
            --disable-crash-handler --disable-sqlite > "$RUNNER_TEMP/nosql.log" 2>&1
          echo "exit status: $?"
          tail -5 "$RUNNER_TEMP/nosql.log"
          echo "text outputs: $(find "$RUNNER_TEMP/out-nosql" -type f | wc -l)"

      - name: Package
        id: package
        run: |
          set -euo pipefail
          NAME="${{ steps.stage.outputs.name }}"
          # tar.gz, not zip: install_displace() unpacks with utils::untar().
          tar -czf "${NAME}.tar.gz" -C payload .
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "sha256=$(cut -d' ' -f1 "${NAME}.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
          cat "${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.stage.outputs.name }}.tar.gz
            ${{ steps.stage.outputs.name }}.tar.gz.sha256
            payload/build-info.json

      - name: Write manifest entry to the step summary
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG:-<tag>}"
          {
            echo '### Windows manifest entry'
            echo
            echo '```json'
            cat <<JSON
          "windows-x86_64": {
            "url": "${BASE}/${{ steps.stage.outputs.name }}.tar.gz",
            "sha256": "${{ steps.package.outputs.sha256 }}",
            "arch": "x86_64",
            "built_on": "windows-2022"
          }
          JSON
            echo '```'
            echo
            echo "smoke test: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release asset
        # Never publish a binary whose smoke test did not pass.
        if: inputs.release_tag != '' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              ${{ inputs.prerelease && '--prerelease' || '' }} \
              --title "DISPLACE binaries${{ inputs.prerelease && ' (beta)' || '' }} ($TAG)" \
              --notes "Headless DISPLACE simulator binaries built by \`.github/workflows/build-displace.yml\` from upstream \`${{ inputs.upstream_ref }}\`. DISPLACE is GPL-2.0; see \`LICENSE.note\`."
          fi
          gh release upload "$TAG" \
            "${{ steps.stage.outputs.name }}.tar.gz" \
            "${{ steps.stage.outputs.name }}.tar.gz.sha256" \
            --clobber
